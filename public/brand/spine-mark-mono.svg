<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="currentColor" role="img" aria-label="Spine">
  <title>Spine</title>
  <!--
    SPINE — single-colour mark.
    Inherits `currentColor`, so it covers: knockout on the graphite rail, print,
    embroidery, favicon, and forced-colors / high-contrast mode.
    On dark surfaces set color: #F6F8F8. On light surfaces set color: #101C20.
  -->
  <rect x="8"  y="8"  width="18" height="17" rx="4"/>
  <rect x="8"  y="29" width="18" height="17" rx="4"/>
  <rect x="8"  y="50" width="18" height="17" rx="4"/>
  <rect x="8"  y="71" width="18" height="17" rx="4"/>

  <rect x="32" y="8"  width="46" height="17" rx="4"/>
  <rect x="32" y="29" width="56" height="17" rx="4"/>
  <rect x="32" y="50" width="38" height="17" rx="4"/>
  <rect x="32" y="71" width="30" height="17" rx="4"/>
</svg>
