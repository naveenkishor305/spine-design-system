<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 308 96" width="308" height="96" role="img" aria-label="Spine design system">
  <title>Spine</title>
  <!--
    SPINE — horizontal lockup.
    Wordmark: Inter, weight 650 (the system's heading weight), tracking -1.5.
    NOTE: outline the text to paths in Figma before final export so the lockup
    never depends on Inter being installed.
    Minimum lockup width 132px. Below that, use spine-mark.svg alone.
  -->

  <!-- Mark -->
  <g fill="#101C20">
    <rect x="8" y="8"  width="18" height="17" rx="4"/>
    <rect x="8" y="29" width="18" height="17" rx="4"/>
    <rect x="8" y="50" width="18" height="17" rx="4"/>
    <rect x="8" y="71" width="18" height="17" rx="4"/>
  </g>
  <rect x="32" y="8"  width="46" height="17" rx="4" fill="#101C20"/>
  <rect x="32" y="29" width="56" height="17" rx="4" fill="#075458"/>
  <rect x="32" y="50" width="38" height="17" rx="4" fill="#101C20"/>
  <rect x="32" y="71" width="30" height="17" rx="4" fill="#101C20"/>

  <!-- Wordmark -->
  <text x="116" y="73"
        font-family="Inter, 'Inter Tight', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="68" font-weight="650" letter-spacing="-1.5"
        fill="#101C20">Spine</text>
</svg>
