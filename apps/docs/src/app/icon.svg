<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Spine">
  <title>Spine</title>
  <!--
    SPINE — primary mark
    Built on the system's own primitives: 4px grid, radius 4, surface.inverse + action.primary.
    Left column  = the graphite clinical spine (navigation rail / vertebral column)
    Right bars   = the paper working surface (data rows / spinous processes)
    Teal bar     = action.primary, the one active state. No red — red is reserved for risk.
    Live area 8→88 on both axes. Clear space = one segment height (17) on all sides.
  -->

  <!-- Spine column — surface.inverse #101C20 -->
  <g fill="#101C20">
    <rect x="8" y="8"  width="18" height="17" rx="4"/>
    <rect x="8" y="29" width="18" height="17" rx="4"/>
    <rect x="8" y="50" width="18" height="17" rx="4"/>
    <rect x="8" y="71" width="18" height="17" rx="4"/>
  </g>

  <!-- Working surface rows -->
  <rect x="32" y="8"  width="46" height="17" rx="4" fill="#101C20"/>
  <rect x="32" y="29" width="56" height="17" rx="4" fill="#075458"/><!-- action.primary -->
  <rect x="32" y="50" width="38" height="17" rx="4" fill="#101C20"/>
  <rect x="32" y="71" width="30" height="17" rx="4" fill="#101C20"/>
</svg>
